<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
</head>
<body>
    <div class="container">
    <h1 class="logo">Login</span></h1>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p class="redirect">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>
     <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const storedData = JSON.parse(sessionStorage.getItem(username));

      if (!storedData) {
        alert("Username not found!");
        return;
      }

      if (storedData[1] !== password) {
        alert("Incorrect password!");
        return;
      }

      alert("Login successful!");
      // Guardamos username en sessionStorage para sesión temporal
      sessionStorage.setItem('currentUser', username);

      window.location.href = "index.html";
    });

    // Fade-in igual que en index
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("loaded");
    });
  </script>
</body>
</html>
