<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><top-nav-bar></top-nav-bar></div>
    <div class="container">
    <h1 class="logo">Register</span></h1>

    <form id="registerForm" method="POST">
      <input type="text" id="name" placeholder="Nombre" required />
      <input type="text" id="email" placeholder="Email" required />
      <input type="text" id="phone" placeholder="Teléfono" required />
      <input type="text" id="cuentaBancaria" placeholder="Cuenta Bancaria" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit">Register</button>
      <p class="redirect">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>

  <script>
const form = document.getElementById('registerForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const payload = {
    nombre: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    telefono: document.getElementById('phone').value.trim(),
    cuentaBancaria: document.getElementById('cuentaBancaria').value.trim(),
    contrasena: document.getElementById('password').value
  };

  if (payload.contrasena !== document.getElementById('confirmPassword').value) {
    alert("Las contraseñas no coinciden");
    return;
  }

  try {
    const response = await fetch("http://localhost:8084/postdata_sql.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "data=" + encodeURIComponent(JSON.stringify(payload))
    });

    const text = await response.text();
    console.log("RAW RESPONSE:", text);

    const result = JSON.parse(text);

    if (result.status === "success") {
      alert("Usuario registrado correctamente");
      window.location.href = "login.html";
    } else {
      alert(result.msg || "Error al registrar");
    }

  } catch (err) {
    console.error(err);
    alert("Error de conexión o respuesta inválida");
  }
});
</script>

</body>
</html>
