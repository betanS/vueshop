<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><top-nav-bar></top-nav-bar></div>
    <div class="container">
    <h1 class="logo">Login</span></h1>

    <form id="loginForm" method="get">
      <input type="text" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p class="redirect">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>
  <script src="script.js"></script>
     <script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const payload = {
    email: document.getElementById('email').value.trim(),
    contrasena: document.getElementById('password').value
  };

  try {
    const response = await fetch("http://localhost:8084/login.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "data=" + encodeURIComponent(JSON.stringify(payload))
    });

    const text = await response.text();
    console.log("RAW RESPONSE:", text);

    const result = JSON.parse(text);

    if (result.status === "success") {
      alert("Login successful!");
      sessionStorage.setItem("loggedUser", payload.email);
      window.location.href = "index.html";
    } else {
      alert(result.msg);
    }

  } catch (err) {
    console.error(err);
    alert("Server error");
  }
});
</script>
</body>
</html>
